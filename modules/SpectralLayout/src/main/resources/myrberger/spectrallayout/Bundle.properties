OpenIDE-Module-Name=Spectral Layout
OpenIDE-Module-Short-Description=Lays out the graph on Laplacian eigenvectors (spectral axes).
OpenIDE-Module-Long-Description=\
Places every node at the coordinates given by eigenvectors of the graph Laplacian (spectral graph drawing). \
By default lambda 2 (the Fiedler vector) is the x axis and lambda 3 the y axis. \
Any eigenvector can be used on any axis, each axis can be linear or logarithmic (symmetric log), and each axis can be switched off: \
the remaining axis then shows the distribution of the nodes, stacked on their exact position. \
Axis lines are drawn by the Preview renderer, so they appear in Preview and in PNG, SVG and PDF export. \
Edge direction is ignored; parallel edges and weights add up. \
The eigenvectors can also be saved to node columns. \
Theory: https://johanm.github.io/graph-matrixmath-ona/graphmatrixmath.html \
By Johan Myrberger, https://www.linkedin.com/in/myrberger/

