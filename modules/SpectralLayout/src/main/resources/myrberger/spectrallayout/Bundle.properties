SpectralLayout.category.save=Write eigenvectors to columns
SpectralLayout.saveCount.name=Eigenvectors to save (\u03bb1 to \u03bbK)
SpectralLayout.saveCount.desc=How many eigenvectors the Save button writes to node columns: lambda 1 up to lambda K (K is capped at the number of nodes). The columns are named eigenvector_<k>_<laplacian>, for example eigenvector_2_combinatorial.
SpectralLayout.saveAction.name=Save eigenvectors to node columns
SpectralLayout.saveAction.desc=Click the "..." button on this row, then Save. Writes the eigenvectors to node columns (Data Laboratory), so they can be used for coloring, ranking or filtering. Uses the Laplacian and edge-weight settings above, and works on the visible graph.

SaveButton.text=Click ... to save
