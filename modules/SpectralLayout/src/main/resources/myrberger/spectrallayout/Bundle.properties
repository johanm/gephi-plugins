SpectralLayout.category.axes=Axes
SpectralLayout.category.spectrum=Spectrum
SpectralLayout.category.scaling=Scaling
SpectralLayout.category.stacking=Stacking (when one axis is none)

SpectralLayout.xEigenvector.name=X axis: eigenvector \u03bbk  (0 = NONE: show distribution)
SpectralLayout.xEigenvector.desc=Index k of the eigenvalue whose eigenvector is the x coordinate. 2 = Fiedler vector, 1 = constant vector. Type 0 for NO eigenvector on x: the y axis then shows the distribution of the nodes, which are stacked on their exact y position. Run the layout again after changing it.
SpectralLayout.yEigenvector.name=Y axis: eigenvector \u03bbk  (0 = NONE: show distribution)
SpectralLayout.yEigenvector.desc=Index k of the eigenvalue whose eigenvector is the y coordinate. Type 0 for NO eigenvector on y: the x axis then shows the distribution of the nodes, which are stacked on their exact x position. Run the layout again after changing it.
SpectralLayout.xScale.name=X axis: scale
SpectralLayout.xScale.desc=Linear, or Log. Log is a symmetric logarithm sign(v) * ln(1 + |v|/c), so negative values and zero are allowed; c is set by the linear-zone setting.
SpectralLayout.yScale.name=Y axis: scale
SpectralLayout.yScale.desc=Linear, or Log (symmetric logarithm, see X axis scale).
SpectralLayout.showXAxis.name=X axis: show line
SpectralLayout.showXAxis.desc=Draw the x axis as a straight line in Preview and in exports. Gephi's Overview window cannot draw it.
SpectralLayout.showYAxis.name=Y axis: show line
SpectralLayout.showYAxis.desc=Draw the y axis as a straight line in Preview and in exports. Gephi's Overview window cannot draw it.
SpectralLayout.flipX.name=X axis: flip
SpectralLayout.flipX.desc=Mirror the x axis. Eigenvectors have no natural sign; the layout makes the entry with the largest magnitude positive, this reverses it.
SpectralLayout.flipY.name=Y axis: flip
SpectralLayout.flipY.desc=Mirror the y axis (see X axis flip).

SpectralLayout.laplacian.name=Laplacian
SpectralLayout.laplacian.desc=Combinatorial L = D - W, Normalised D^-1/2 L D^-1/2 (eigenvectors as they are), or Random walk (eigenvectors of the normalised one multiplied by D^-1/2).
SpectralLayout.useWeights.name=Use edge weights
SpectralLayout.useWeights.desc=Edge weights act as spring strengths. Weights that are zero, negative or not finite are ignored. If off, every edge counts 1.
SpectralLayout.seed.name=Random seed
SpectralLayout.seed.desc=Seed of the start vectors of the iterative solver used for large graphs (more than 1000 nodes). Same seed, same result.

SpectralLayout.scale.name=Axis half-width
SpectralLayout.scale.desc=Every axis is scaled so that its largest coordinate (in magnitude) equals this value.
SpectralLayout.logLinear.name=Log axis: linear zone
SpectralLayout.logLinear.desc=Fraction of the largest magnitude below which a Log axis behaves linearly (c in the symmetric logarithm). Smaller values give a stronger logarithmic effect. Range 1e-9 to 1.

SpectralLayout.stackBins.name=Stack bins
SpectralLayout.stackBins.desc=Number of equally wide bins over the axis. Nodes in the same bin are stacked on top of each other, each at its exact position along the axis.
SpectralLayout.stackSpacing.name=Stack spacing
SpectralLayout.stackSpacing.desc=Distance between stacked nodes, as a multiple of the bin width.
SpectralLayout.stackCentered.name=Center stacks on axis
SpectralLayout.stackCentered.desc=Off: stacks grow away from the axis line. On: stacks are centred on it.

